name: Frontend CI

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'pulsarr_web/**'
      - '.github/workflows/ci-frontend.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: auirsblade/pulsarr-web

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsarr_web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pulsarr_web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --build

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || (github.ref_name == 'main' && 'qual' || 'dev') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine app tag
        id: app-tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "value=beta - ${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "value=qual" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:pulsarr_web"
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VITE_APP_TAG=${{ steps.app-tag.outputs.value }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || (github.ref_name == 'main' && 'qual' || 'dev') }}
    steps:
      - name: Deploy to Dokploy
        run: |
          curl -s -X POST "${{ secrets.DOKPLOY_API_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"applicationId": "${{ secrets.DOKPLOY_APP_ID_WEB }}"}'
