name: Backend CI

on:
  workflow_dispatch:
  push:
    branches: [develop, main]
    paths:
      - 'pulsarr_fulcrum/**'
      - 'db/**'
      - '.github/workflows/ci-backend.yml'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: auirsblade/pulsarr-fulcrum

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pulsarr_fulcrum
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pulsarr_fulcrum

      - name: cargo check
        run: cargo check --locked

      - name: cargo clippy
        run: cargo clippy --locked

  build-and-push:
    needs: check
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || (github.ref_name == 'main' && 'qual' || 'dev') }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tags
        id: tags
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }},${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: "{{defaultContext}}:pulsarr_fulcrum"
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || (github.ref_name == 'main' && 'qual' || 'dev') }}
    steps:
      - name: Deploy to Dokploy
        run: |
          curl -s -X POST "${{ secrets.DOKPLOY_API_URL }}/api/application.deploy" \
            -H "x-api-key: ${{ secrets.DOKPLOY_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"applicationId": "${{ secrets.DOKPLOY_APP_ID_FULCRUM }}"}'
